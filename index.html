<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajwad AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292d35;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 7px 0 0;
      color: #9ca3af;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .ai {
      background: #1d232d;
      margin-left: auto;
    }

    .user {
      background: #2563eb;
      margin-right: auto;
    }

    .bottom {
      padding: 12px;
      border-top: 1px solid #292d35;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 16px;
      background: #1d232d;
      color: white;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 18px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    #mic {
      background: #16a34a;
    }
  </style>
</head>

<body>

<header>
  <h1>Ajwad AI 🤖</h1>
  <p>مساعدك الشخصي</p>
</header>

<div id="chat">
  <div class="message ai">
    أهلاً أجود ❤️
